name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "quartz_content/**"
      - "quartz_theme/**"
      - ".github/workflows/pages.yml"
      - "CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Quartz site
        run: |
          git clone --depth=1 https://github.com/jackyzha0/quartz.git .quartz
          rsync -a quartz_content/ .quartz/content/
          if [ -d quartz_theme/styles ]; then
            rsync -a quartz_theme/styles/ .quartz/quartz/styles/
          fi
          if [ -f CNAME ]; then
            cp CNAME .quartz/content/CNAME
          fi
          cd .quartz
          npm ci
          npx quartz build
          if [ -f ../CNAME ]; then
            cp ../CNAME public/CNAME
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

